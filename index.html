<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Intrados Designs – Candidate Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header" role="banner">
  <div class="header-inner">
    <div class="logo-lockup" aria-label="Intrados Designs">
      <img src="https://drive.google.com/thumbnail?id=15vrGO2Vyw49k9AzooJ2wT9TMJ8rXjgJm&sz=w400" alt="Intrados Designs" class="logo-image" />
    </div>
    <div class="candidate-badge" id="candidate-badge" style="display:none;">
      <span class="candidate-badge-name" id="badge-name"></span>
      <span class="candidate-badge-ref" id="badge-ref"></span>
    </div>
  </div>
</header>

<main class="page-wrapper" role="main">

  <section id="loading-view">
    <div class="card">
      <div class="card-body" style="text-align:center;">
        <p class="page-sub">Loading your assessments...</p>
      </div>
    </div>
  </section>

  <section id="error-view" style="display:none;">
    <div class="card">
      <div class="card-header">
        <div class="intro">
          <span class="section-badge">⚠️ Not Verified</span>
          <h1 class="page-title">Access Not Verified</h1>
          <p class="page-sub" id="error-message"></p>
          <p class="page-sub" style="margin-top:12px;">
            <a href="https://intrados-technology.github.io/login-page/" style="color:var(--primary); font-weight:600;">← Back to Login</a>
          </p>
        </div>
      </div>
    </div>
  </section>

  <section id="list-view" style="display:none;">
    <div class="card">
      <div class="card-header">
        <div class="intro">
          <span class="section-badge">📋 Candidate Portal</span>
          <h1 class="page-title" id="welcome-heading">Welcome</h1>
          <p class="page-sub">
            Choose an assessment below to proceed. Only tests relevant to your application are shown.
          </p>
        </div>
      </div>
      <div class="card-body">
        <div class="form-grid">

          <div class="form-group">
            <label class="form-label" for="test-select">Select Assessment</label>
            <select id="test-select" class="form-input">
              <!-- populated by script.js -->
            </select>
          </div>

          <button id="btn-proceed" class="btn-primary" type="button">
            <span>Proceed</span>
            <span aria-hidden="true">→</span>
          </button>

        </div>
      </div>
    </div>
  </section>

</main>

<footer class="site-footer">© Intrados Designs · Confidential Candidate Portal</footer>

<script src="script.js"></script>
</body>
</html>
